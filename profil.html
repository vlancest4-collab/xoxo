<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil | XOXO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>XOXO</h1>

    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="manga.html">Manga</a>
        <a href="manhwa.html">Manhwa</a>
        <a href="hakkimizda.html">Hakkımızda</a>
    </nav>

</header>


<main>

    <section class="profile-page">

        <div class="profile-box">

            <div class="angel-decoration">
                ✦ 🪽 ✦
            </div>
<input
    type="file"
    id="avatarInput"
    accept="image/*"
>
    <img id="avatarPreview" src="" alt="Profil fotoğrafı">       
            <h2>Profilim</h2>
<div class="profile-avatar">
    🪽
</div>
            <p id="userEmail"></p>

            <input
                type="text"
                id="username"
                placeholder="Kullanıcı adın"
            >

            <button id="saveBtn">
                Profili Kaydet
            </button>
<p id="avatarMessage"></p>
            <button id="logoutBtn">
                Çıkış Yap
            </button>

            <p id="message"></p>

        </div>

    </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://mzskvwfwvxlvftvouffh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_HvBp7t00DICwT2q-LjFMjg_XuQr5hOV";

const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const userEmail = document.getElementById("userEmail");
const username = document.getElementById("username");
const saveBtn = document.getElementById("saveBtn");
const logoutBtn = document.getElementById("logoutBtn");
const message = document.getElementById("message");


async function loadProfile() {

    const { data: { session } } =
        await db.auth.getSession();

    if (!session) {
        window.location.href = "auth.html";
        return;
    }

    userEmail.textContent = session.user.email;

    const { data } = await db
        .from("profiles")
        .select("username")
        .eq("id", session.user.id)
        .maybeSingle();

    if (data) {
        username.value = data.username || "";
    }
}


saveBtn.addEventListener("click", async function () {

    const { data: { session } } =
        await db.auth.getSession();

    if (!session) {
        window.location.href = "auth.html";
        return;
    }

    const name = username.value.trim();

    if (!name) {
        message.textContent = "Kullanıcı adı boş olamaz.";
        return;
    }

    saveBtn.disabled = true;
    message.textContent = "Kaydediliyor...";

    const { error } = await db
        .from("profiles")
        .upsert({
            id: session.user.id,
            username: name
        });

    if (error) {
        message.textContent =
            "Hata: " + error.message;

        saveBtn.disabled = false;
        return;
    }

    message.textContent =
        "Profil başarıyla kaydedildi!";

    saveBtn.disabled = false;
});


logoutBtn.addEventListener("click", async function () {

    await db.auth.signOut();

    window.location.href = "auth.html";
});


loadProfile();
const avatarInput = document.getElementById("avatarInput");
const avatarMessage = document.getElementById("avatarMessage");
const avatar = document.querySelector(".profile-avatar");

avatarInput.addEventListener("change", async function () {

    const file = avatarInput.files[0];

    if (!file) return;

    avatarMessage.textContent = "Fotoğraf yükleniyor...";

    const { data: { session } } = await db.auth.getSession();

    if (!session) {
        window.location.href = "auth.html";
        return;
    }

    const fileExt = file.name.split(".").pop();
    const fileName = session.user.id + "." + fileExt;

    const { error } = await db.storage
        .from("avatars")
        .upload(fileName, file, {
            upsert: true
        });

    if (error) {
        avatarMessage.textContent = "Fotoğraf yüklenemedi.";
        console.error(error);
        return;
    }

    const { data } = db.storage
        .from("avatars")
        .getPublicUrl(fileName);

    avatar.innerHTML = `
        <img src="${data.publicUrl}"
             style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
    `;

    avatarMessage.textContent = "Fotoğraf kaydedildi!";

});
</script>
<script>
async function loadProfile() {

    const { data: { session } } = await db.auth.getSession();

    if (!session) {
        window.location.href = "auth.html";
        return;
    }

    const { data: profile } = await db
        .from("profiles")
        .select("username")
        .eq("id", session.user.id)
        .maybeSingle();

    if (profile) {
        document.getElementById("username").value =
            profile.username || "";
    }
}


document.getElementById("saveBtn").addEventListener("click", async function () {

    const { data: { session } } = await db.auth.getSession();

    if (!session) {
        window.location.href = "auth.html";
        return;
    }

    const username =
        document.getElementById("username").value.trim();

    const message =
        document.getElementById("message");

    if (!username) {
        message.textContent = "Kullanıcı adı yazmalısın.";
        return;
    }

    const { error } = await db
        .from("profiles")
        .upsert({
            id: session.user.id,
            username: username
        });

    if (error) {
        console.error(error);
        message.textContent = "Profil kaydedilemedi.";
        return;
    }

    message.textContent = "Profil başarıyla kaydedildi! 🪽";
});


loadProfile();
</script>
</body>

</html>

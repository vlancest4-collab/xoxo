<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil | XOXO</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .profile-page {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .profile-box {
            width: 100%;
            max-width: 520px;
            padding: 40px 35px;
            border-radius: 28px;
            background: rgba(40, 36, 43, 0.96);
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 15px 50px rgba(0,0,0,0.35);
            text-align: center;
        }

        .angel-decoration {
            font-size: 30px;
            margin-bottom: 25px;
        }

        .avatar-wrapper {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid #e88db6;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: #302c32;
        }

        .avatar-wrapper:hover {
            box-shadow: 0 0 20px rgba(232,141,182,0.35);
        }

        #avatarPreview {
            width: 100%;
            height: 100%;
            display: none;
            object-fit: cover;
            border-radius: 50%;
        }

        .avatar-placeholder {
            font-size: 45px;
            user-select: none;
        }

        #avatarFileName {
            margin: 8px 0 20px;
            color: #cfc8d0;
            font-size: 13px;
            word-break: break-all;
        }

        .profile-box h2 {
            color: #ec91b9;
            font-size: 36px;
            margin: 10px 0 18px;
        }

        .user-email {
            color: #cfc8d0;
            margin-bottom: 25px;
        }

        #username {
            width: 100%;
            box-sizing: border-box;
            padding: 17px;
            border-radius: 16px;
            border: 1px solid #625b65;
            background: #242125;
            color: white;
            font-size: 17px;
            outline: none;
            margin-bottom: 20px;
        }

        #username:focus {
            border-color: #e88db6;
        }

        #saveBtn,
        #logoutBtn {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #saveBtn {
            background: #e88db6;
            color: #211d22;
        }

        #saveBtn:hover {
            background: #f09bc2;
        }

        #logoutBtn {
            margin-top: 10px;
            background: #454047;
            color: white;
        }

        #message {
            min-height: 22px;
            margin-top: 18px;
            color: #f0a0c3;
        }
    </style>
</head>

<body>

<header>
    <h1>XOXO</h1>

    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="manga.html">Manga</a>
        <a href="manhwa.html">Manhwa</a>
        <a href="hakkimizda.html">Hakkımızda</a>
    </nav>
</header>

<main>

    <section class="profile-page">

        <div class="profile-box">

            <div class="angel-decoration">
                ✦ 🪽 ✦
            </div>

            <!-- TEK FOTOĞRAF ALANI -->
            <label for="avatarInput" class="avatar-wrapper">

                <img
                    id="avatarPreview"
                    src=""
                    alt="Profil fotoğrafı"
                >

                <span
                    id="avatarPlaceholder"
                    class="avatar-placeholder"
                >
                    🪽
                </span>

            </label>

            <input
                type="file"
                id="avatarInput"
                accept="image/*"
                hidden
            >

            <p id="avatarFileName"></p>

            <h2>Profilim</h2>

            <p id="userEmail" class="user-email"></p>

            <input
                type="text"
                id="username"
                placeholder="Kullanıcı adın"
                maxlength="30"
            >

            <button id="saveBtn">
                Profili Kaydet
            </button>

            <button id="logoutBtn">
                Çıkış Yap
            </button>

            <p id="message"></p>

        </div>

    </section>

</main>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    /* =========================================
       SUPABASE AYARLARI
       ========================================= */

    const SUPABASE_URL =
        "https://mzskvwfwwxlvftvouffh.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_HvBp7t00DICwT2q-LjFMjg_XuQr5hOV";


    const { createClient } = supabase;

    const db = createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    /* =========================================
       HTML ELEMENTLERİ
       ========================================= */

    const avatarInput =
        document.getElementById("avatarInput");

    const avatarPreview =
        document.getElementById("avatarPreview");

    const avatarPlaceholder =
        document.getElementById("avatarPlaceholder");

    const avatarFileName =
        document.getElementById("avatarFileName");

    const usernameInput =
        document.getElementById("username");

    const userEmail =
        document.getElementById("userEmail");

    const saveBtn =
        document.getElementById("saveBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const message =
        document.getElementById("message");


    /* =========================================
       PROFİLİ YÜKLE
       ========================================= */

    async function loadProfile() {

        message.textContent = "";

        const {
            data: {
                session
            }
        } = await db.auth.getSession();


        /* Giriş yapılmamışsa */

        if (!session) {

            window.location.href = "auth.html";

            return;
        }


        const userId =
            session.user.id;


        /* Email */

        userEmail.textContent =
            session.user.email || "";


        /* Profiles tablosundan bilgileri al */

        const {
            data: profile,
            error
        } = await db
            .from("profiles")
            .select("username, avatar_url")
            .eq("id", userId)
            .maybeSingle();


        if (error) {

            console.error(
                "Profil yükleme hatası:",
                error
            );

            message.textContent =
                "Profil bilgileri alınamadı.";

            return;
        }


        /* Kullanıcı adı */

        if (profile && profile.username) {

            usernameInput.value =
                profile.username;
        }


        /* Profil fotoğrafı */

        if (
            profile &&
            profile.avatar_url
        ) {

            avatarPreview.src =
                profile.avatar_url +
                (profile.avatar_url.includes("?")
                    ? "&"
                    : "?") +
                "t=" +
                Date.now();

            avatarPreview.style.display =
                "block";

            avatarPlaceholder.style.display =
                "none";
        }

    }


    /* =========================================
       FOTOĞRAF SEÇİLDİĞİNDE
       ========================================= */

    avatarInput.addEventListener(
        "change",
        async function () {

            const file =
                avatarInput.files[0];


            if (!file) {
                return;
            }


            /* Sadece resim */

            if (!file.type.startsWith("image/")) {

                message.textContent =
                    "Lütfen bir fotoğraf seç.";

                avatarInput.value = "";

                return;
            }


            /*
             * FOTOĞRAFI ANINDA GÖSTER
             * Supabase'i beklemiyoruz.
             */

            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    avatarPreview.src =
                        event.target.result;

                    avatarPreview.style.display =
                        "block";

                    avatarPlaceholder.style.display =
                        "none";
                };


            reader.readAsDataURL(file);


            avatarFileName.textContent =
                file.name;


            message.textContent =
                "Fotoğraf seçildi. Profili Kaydet'e bas.";


            /*
             * Burada Supabase'e yüklemiyoruz.
             *
             * Kullanıcı "Profili Kaydet"
             * butonuna basınca isim + fotoğraf
             * beraber kaydedilecek.
             */
        }
    );


    /* =========================================
       PROFİLİ KAYDET
       ========================================= */

    saveBtn.addEventListener(
        "click",
        async function () {

            saveBtn.disabled = true;

            saveBtn.textContent =
                "Kaydediliyor...";

            message.textContent = "";


            try {

                const {
                    data: {
                        session
                    }
                } = await db.auth.getSession();


                if (!session) {

                    window.location.href =
                        "auth.html";

                    return;
                }


                const userId =
                    session.user.id;


                const username =
                    usernameInput.value.trim();


                /* Kullanıcı adı kontrolü */

                if (!username) {

                    message.textContent =
                        "Kullanıcı adı boş olamaz.";

                    return;
                }


                /* =================================
                   1. KULLANICI ADINI KAYDET
                   ================================= */

                const {
                    error: usernameError
                } = await db
                    .from("profiles")
                    .update({
                        username: username
                    })
                    .eq("id", userId);


                if (usernameError) {

                    console.error(
                        "Username hatası:",
                        usernameError
                    );

                    message.textContent =
                        "Kullanıcı adı kaydedilemedi.";

                    return;
                }


                /* =================================
                   2. FOTOĞRAF SEÇİLDİYSE YÜKLE
                   ================================= */

                const file =
                    avatarInput.files[0];


                if (file) {

                    const fileExt =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    /*
                     * Her kullanıcı için
                     * aynı dosya adı.
                     *
                     * Eski fotoğrafın üzerine yazar.
                     */

                    const fileName =
                        userId +
                        "." +
                        fileExt;


                    const {
                        error: uploadError
                    } = await db.storage
                        .from("avatars")
                        .upload(
                            fileName,
                            file,
                            {
                                upsert: true,
                                contentType: file.type
                            }
                        );


                    if (uploadError) {

                        console.error(
                            "Fotoğraf yükleme hatası:",
                            uploadError
                        );

                        message.textContent =
                            "Fotoğraf yüklenemedi: " +
                            uploadError.message;

                        return;
                    }


                    /* =================================
                       3. PUBLIC URL AL
                       ================================= */

                    const {
                        data: urlData
                    } = db.storage
                        .from("avatars")
                        .getPublicUrl(
                            fileName
                        );


                    const avatarUrl =
                        urlData.publicUrl;


                    /* =================================
                       4. PROFILES AVATAR_URL GÜNCELLE
                       ================================= */

                    const {
                        error: avatarError
                    } = await db
                        .from("profiles")
                        .update({
                            avatar_url:
                                avatarUrl
                        })
                        .eq(
                            "id",
                            userId
                        );


                    if (avatarError) {

                        console.error(
                            "Avatar database hatası:",
                            avatarError
                        );

                        message.textContent =
                            "Fotoğraf veritabanına kaydedilemedi.";

                        return;
                    }


                    /* Cache'i temizlemek için */

                    avatarPreview.src =
                        avatarUrl +
                        "?t=" +
                        Date.now();

                }


                /* =================================
                   BAŞARILI
                   ================================= */

                message.textContent =
                    "Profil başarıyla kaydedildi!";

                avatarInput.value = "";

                avatarFileName.textContent = "";


            } catch (error) {

                console.error(
                    "Genel hata:",
                    error
                );

                message.textContent =
                    "Bir hata oluştu: " +
                    error.message;

            } finally {

                saveBtn.disabled = false;

                saveBtn.textContent =
                    "Profili Kaydet";
            }

        }
    );


    /* =========================================
       ÇIKIŞ
       ========================================= */

    logoutBtn.addEventListener(
        "click",
        async function () {

            await db.auth.signOut();

            window.location.href =
                "auth.html";
        }
    );


    /* =========================================
       SAYFA AÇILINCA PROFİLİ GETİR
       ========================================= */

    loadProfile();

</script>

</body>
</html>

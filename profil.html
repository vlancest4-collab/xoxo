<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil | XOXO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>XOXO</h1>

    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="manga.html">Manga</a>
        <a href="manhwa.html">Manhwa</a>
        <a href="hakkimizda.html">Hakkımızda</a>
    </nav>

</header>


<main>

    <section class="profile-page">

        <div class="profile-box">

            <div class="angel-decoration">
                ✦ 🪽 ✦
            </div>
<input
    type="file"
    id="avatarInput"
    accept="image/*"
>
    <img id="avatarPreview" src="" alt="Profil fotoğrafı">       
            <h2>Profilim</h2>
<div class="profile-avatar">
    🪽
</div>
            <p id="userEmail"></p>

            <input
                type="text"
                id="username"
                placeholder="Kullanıcı adın"
            >

            <button id="saveBtn">
                Profili Kaydet
            </button>
<p id="avatarMessage"></p>
            <button id="logoutBtn">
                Çıkış Yap
            </button>

            <p id="message"></p>

        </div>

    </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://mzskvwfwvxlvftvouffh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_HvBp7t00DICwT2q-LjFMjg_XuQr5hOV";

const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const userEmail = document.getElementById("userEmail");
const username = document.getElementById("username");
const saveBtn = document.getElementById("saveBtn");
const logoutBtn = document.getElementById("logoutBtn");
const message = document.getElementById("message");


async function loadProfile() {

    const { data: { session } } =
        await db.auth.getSession();

    if (!session) {
        window.location.href = "auth.html";
        return;
    }

    userEmail.textContent = session.user.email;

    const { data } = await db
        .from("profiles")
        .select("username")
        .eq("id", session.user.id)
        .maybeSingle();

    if (data) {
        username.value = data.username || "";
    }
}


saveBtn.addEventListener("click", async function () {

    const { data: { session } } =
        await db.auth.getSession();

    if (!session) {
        window.location.href = "auth.html";
        return;
    }

    const name = username.value.trim();

    if (!name) {
        message.textContent = "Kullanıcı adı boş olamaz.";
        return;
    }

    saveBtn.disabled = true;
    message.textContent = "Kaydediliyor...";

    const { error } = await db
        .from("profiles")
        .upsert({
            id: session.user.id,
            username: name
        });

    if (error) {
        message.textContent =
            "Hata: " + error.message;

        saveBtn.disabled = false;
        return;
    }

    message.textContent =
        "Profil başarıyla kaydedildi!";

    saveBtn.disabled = false;
});


logoutBtn.addEventListener("click", async function () {

    await db.auth.signOut();

    window.location.href = "auth.html";
});
const avatarInput = document.getElementById("avatarInput");
const avatarPreview = document.getElementById("avatarPreview");

avatarInput.addEventListener("change", async function () {

    const file = avatarInput.files[0];

    if (!file) return;

    const { data: { session } } = await db.auth.getSession();

    if (!session) {
        window.location.href = "auth.html";
        return;
    }

    // Sadece resim kabul et
    if (!file.type.startsWith("image/")) {
        alert("Lütfen bir fotoğraf seç.");
        return;
    }

    const fileExt = file.name.split(".").pop();
    const fileName = session.user.id + "." + fileExt;

    // Supabase Storage'a yükle
    const { error: uploadError } = await db.storage
        .from("avatars")
        .upload(fileName, file, {
            upsert: true
        });

    if (uploadError) {
        console.error(uploadError);
        alert("Fotoğraf yüklenemedi.");
        return;
    }

    // Public URL al
    const { data: urlData } = db.storage
        .from("avatars")
        .getPublicUrl(fileName);

    const avatarUrl = urlData.publicUrl;

    // profiles tablosundaki avatar_url'i güncelle
    const { error: updateError } = await db
        .from("profiles")
        .update({
            avatar_url: avatarUrl
        })
        .eq("id", session.user.id);

    if (updateError) {
        console.error(updateError);
        alert("Fotoğraf kaydedilemedi.");
        return;
    }

    // Sayfada hemen göster
    avatarPreview.src = avatarUrl;

    alert("Profil fotoğrafı kaydedildi!");
});


</body>

</html>

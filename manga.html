<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manga | XOXO</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>XOXO</h1>

    <nav>

        <a href="index.html">Ana Sayfa</a>

        <a href="manga.html">Manga</a>

        <a href="manhwa.html">Manhwa</a>

        <a href="hakkimizda.html">Hakkımızda</a>

    </nav>

</header>


<main>

    <section class="manga-section">

        <h2>Mangalar</h2>
<div class="search-box">
    <input
        type="text"
        id="mangaSearch"
        placeholder="Manga ara..."
    >
</div>
        <div class="manga-container">


            <div class="manga-card" onclick="openManga()">

                <div class="cover">
                    KAPAK
                </div>

                <h3>Manga 1</h3>

                <p>Bölüm 10</p>

            </div>


            <div class="manga-card" onclick="openManga()">

                <div class="cover">
                    KAPAK
                </div>

                <h3>Manga 2</h3>

                <p>Bölüm 5</p>

            </div>


        </div>

    </section>

</main>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mzskvwfwvxlvftvouffh.supabase.co";
const SUPABASE_KEY = "sb_publishable_HvBp7t00DICwT2q-LjFMjg_XuQr5hOV";

const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function openManga() {

    const { data: { session } } = await db.auth.getSession();

    if (!session) {
        window.location.href = "auth.html";
        return;
    }

    window.location.href = "manga-okuma.html";
}
const search = document.getElementById("mangaSearch");
const cards = document.querySelectorAll(".manga-card");

search.addEventListener("input", function () {

    const text = search.value.toLowerCase();

    cards.forEach(function (card) {

        const title = card.querySelector("h3").textContent.toLowerCase();

        card.style.display =
            title.includes(text) ? "" : "none";

    });

});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Giriş / Kayıt | XOXO</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .auth-page {
            min-height: 75vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 430px;

            padding: 35px;

            background: #302d32;

            border: 1px solid #48434a;

            border-radius: 20px;

            box-sizing: border-box;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .auth-decoration {
            text-align: center;

            color: #f2a5c7;

            font-size: 24px;

            margin-bottom: 15px;
        }

        .auth-box h1 {
            color: #f2a5c7;

            text-align: center;

            margin-bottom: 25px;
        }

        .auth-box input {
            width: 100%;

            box-sizing: border-box;

            padding: 14px;

            margin: 8px 0 15px;

            border: 1px solid #5a535c;

            border-radius: 10px;

            background: #242124;

            color: white;

            font-size: 15px;

            outline: none;
        }

        .auth-box input:focus {
            border-color: #e995ba;
        }

        .auth-box button {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 25px;

            background: #e995ba;

            color: #272329;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .auth-box button:hover {
            background: #f2adcb;
        }

        .switch {
            text-align: center;

            margin-top: 20px;

            color: #cfc3ca;
        }

        .switch a {
            color: #f2a5c7;

            cursor: pointer;

            margin-left: 5px;
        }

        #message {
            text-align: center;

            margin-top: 15px;

            min-height: 20px;
        }

        @media (max-width: 600px) {

            .auth-page {
                padding: 25px 15px;
            }

            .auth-box {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <a href="index.html" class="logo">
            XOXO
        </a>

        <nav>

            <a href="index.html">
                Ana Sayfa
            </a>

            <a href="manga.html">
                Manga
            </a>

            <a href="manhwa.html">
                Manhwa
            </a>

            <a href="hakkimizda.html">
                Hakkımızda
            </a>

        </nav>

    </div>

</header>


<main class="auth-page">

    <div class="auth-box">

        <div class="auth-decoration">
            ✦ 🪽 ✦
        </div>

        <h1 id="title">
            Kayıt Ol
        </h1>


        <form id="authForm">

            <input
                type="email"
                id="email"
                placeholder="E-posta adresin"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Şifren"
                minlength="6"
                required
            >

            <button
                type="submit"
                id="submitBtn"
            >
                Kayıt Ol
            </button>

        </form>


        <div class="switch">

            <span id="switchText">
                Zaten hesabın var mı?
            </span>

            <a id="switchBtn">
                Giriş Yap
            </a>

        </div>


        <p id="message"></p>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://mzskvwfwvxlvftvouffh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_HvBp7t00DICwT2q-LjFMjg_XuQr5hOV";


const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let isLogin = false;


const form =
    document.getElementById("authForm");

const title =
    document.getElementById("title");

const submitBtn =
    document.getElementById("submitBtn");

const switchText =
    document.getElementById("switchText");

const switchBtn =
    document.getElementById("switchBtn");

const message =
    document.getElementById("message");


/* GİRİŞ / KAYIT DEĞİŞTİR */

switchBtn.addEventListener("click", function () {

    isLogin = !isLogin;

    message.textContent = "";

    if (isLogin) {

        title.textContent = "Giriş Yap";

        submitBtn.textContent = "Giriş Yap";

        switchText.textContent =
            "Hesabın yok mu?";

        switchBtn.textContent =
            "Kayıt Ol";

    } else {

        title.textContent = "Kayıt Ol";

        submitBtn.textContent = "Kayıt Ol";

        switchText.textContent =
            "Zaten hesabın var mı?";

        switchBtn.textContent =
            "Giriş Yap";

    }

});


/* FORM */

form.addEventListener("submit", async function (event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    submitBtn.disabled = true;

    message.textContent = "Lütfen bekle...";


    /* KAYIT */

    if (!isLogin) {

        const { data, error } =
            await db.auth.signUp({

                email: email,

                password: password

            });


        if (error) {

            message.textContent =
                error.message;

            submitBtn.disabled = false;

            return;

        }


        message.textContent =
            "Kayıt başarılı! E-postanı kontrol et.";

        submitBtn.disabled = false;

        return;

    }


    /* GİRİŞ */

    const { data, error } =
        await db.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        message.textContent =
            "E-posta veya şifre hatalı.";

        submitBtn.disabled = false;

        return;

    }


    message.textContent =
        "Giriş başarılı!";


    window.location.href =
        "profil.html";

});

</script>


</body>

</html>

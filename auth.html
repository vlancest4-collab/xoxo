<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOXO - Giriş Yap</title>

    <style>
        body {
            margin: 0;
            background: #242124;
            color: #f5f0f3;
            font-family: Arial, sans-serif;
        }

        header {
            background: #302d32;
            padding: 22px 6%;
            border-bottom: 1px solid #48434a;
        }

        header a {
            color: #f09bc0;
            text-decoration: none;
            font-size: 28px;
            font-weight: bold;
        }

        .auth-box {
            width: 90%;
            max-width: 430px;
            margin: 80px auto;
            padding: 35px;
            background: #302d32;
            border: 1px solid #48434a;
            border-radius: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #f2a5c7;
            text-align: center;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 8px 0 15px;
            border: 1px solid #5a535c;
            border-radius: 10px;
            background: #242124;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 25px;
            background: #e995ba;
            color: #272329;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f2adcb;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
        }

        .switch a {
            color: #f2a5c7;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">XOXO</a>
</header>

<div class="auth-box">

    <h1 id="title">Kayıt Ol</h1>

    <form id="authForm">

        <input
            type="email"
            id="email"
            placeholder="E-posta adresin"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Şifren"
            required
        >

        <button type="submit" id="submitBtn">
            Kayıt Ol
        </button>

    </form>

    <div class="switch">
        <span id="switchText">Zaten hesabın var mı?</span>
        <a id="switchBtn">Giriş Yap</a>
    </div>

    <p id="message"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://mzskvwfwvxlvftvouffh.supabase.co";

const SUPABASE_KEY = "sb_publishable_HvBp7t00DICwT2q-LjFMjg_XuQr5hOV";

const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let loginMode = false;


const form = document.getElementById("authForm");
const title = document.getElementById("title");
const submitBtn = document.getElementById("submitBtn");
const switchText = document.getElementById("switchText");
const switchBtn = document.getElementById("switchBtn");
const message = document.getElementById("message");


switchBtn.addEventListener("click", () => {

    loginMode = !loginMode;

    if (loginMode) {

        title.textContent = "Giriş Yap";
        submitBtn.textContent = "Giriş Yap";
        switchText.textContent = "Hesabın yok mu?";
        switchBtn.textContent = "Kayıt Ol";

    } else {

        title.textContent = "Kayıt Ol";
        submitBtn.textContent = "Kayıt Ol";
        switchText.textContent = "Zaten hesabın var mı?";
        switchBtn.textContent = "Giriş Yap";

    }

    message.textContent = "";

});


form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    message.textContent = "İşlem yapılıyor...";


    if (loginMode) {

        const { error } = await db.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {

            message.textContent = "E-posta veya şifre hatalı.";

            return;
        }

        message.textContent = "Giriş başarılı!";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1000);


    } else {

        const { error } = await db.auth.signUp({

            email: email,
            password: password,

            options: {
                emailRedirectTo:
                "https://vlancest4-collab.github.io/xoxo/"
            }

        });


        if (error) {

            message.textContent = error.message;

            return;
        }

        message.textContent =
            "Kayıt başarılı! E-postanı kontrol edip hesabını doğrula. 💌";

    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XOXO Manga</title>
    <meta name="description" content="XOXO Manga - Manga ve Manhwa dünyasını keşfet.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="header-inner">

        <a href="index.html" class="logo">XOXO</a>

        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="manga.html">Manga</a>
            <a href="manhwa.html">Manhwa</a>
            <a href="hakkimizda.html">Hakkımızda</a>
        </nav>

        <div class="account-area">
            <a href="auth.html" class="login-button">Giriş / Kayıt</a>
            <a href="profil.html" class="profile-button">Profil</a>
        </div>

    </div>
</header>


<main>

    <section class="hero">

        <div class="angel-decoration">
            ✦ 🪽 ✦
        </div>

        <h2>Manga & Manhwa Dünyasına Hoş Geldin</h2>

        <p>
            En sevdiğin serileri burada keşfet.
        </p>

        <div class="search-box">
            <input
                type="text"
                placeholder="Manga veya manhwa ara..."
                id="searchInput"
            >

            <button onclick="searchManga()">
                Ara
            </button>
        </div>

        <a href="manga.html" class="explore-button">
            Mangaları Keşfet
        </a>

    </section>

</main>


<footer>
    <p>© 2026 XOXO Manga</p>
</footer>


<script>
function searchManga() {

    const search = document
        .getElementById("searchInput")
        .value
        .trim();

    if (search !== "") {
        window.location.href =
            "manga.html?search=" + encodeURIComponent(search);
    } else {
        window.location.href = "manga.html";
    }
}
</script>

</body>
</html>
